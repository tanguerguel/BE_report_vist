<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <!-- Estilos de hoja A4 comunes a la ficha en blanco y a la ficha aplicada (hoja-ficha.css del front). -->
    <style th:fragment="estilos">
        /* Formato de hoja A4, el mismo de la vista previa del front (hoja-ficha.css). */
        @page {
            size: A4;
            margin: 12mm 11mm;
        }

        body {
            margin: 0;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            line-height: 1.35;
        }

        @media screen {
            body {
                background: #e9edf1;
                padding: 16px;
            }

            .hoja {
                width: 210mm;
                min-height: 297mm;
                margin: 0 auto;
                padding: 12mm 11mm;
                box-sizing: border-box;
                background: #fff;
                box-shadow: 0 3px 14px rgba(0, 0, 0, 0.15);
            }
        }

        .hoja__encabezado {
            display: block;
            width: 100%;
            height: auto;
        }

        .hoja__titulo {
            margin: 12px 0 14px;
            font-size: 18px;
            line-height: 1.25;
            text-align: center;
            text-transform: uppercase;
        }

        .hoja__titulo--con-distintivo {
            margin-bottom: 4px;
        }

        .hoja__distintivo {
            margin: 0 0 14px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }

        .hoja__norma {
            margin: 0 0 18px;
            font-size: 10px;
        }

        .hoja__seccion {
            margin: 14px 0 6px;
            font-size: 13px;
            text-transform: uppercase;
            page-break-after: avoid;
        }

        .hoja__dimension {
            margin-top: 16px;
        }

        /* Tablas */
        .tabla {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .tabla th,
        .tabla td {
            padding: 5px 6px;
            border: 1px solid #111;
            text-align: left;
            vertical-align: top;
            word-wrap: break-word;
        }

        .tabla th {
            background: #ddd;
        }

        .tabla tr {
            page-break-inside: avoid;
        }

        .tabla--escala th,
        .tabla--escala td {
            text-align: center;
        }

        .tabla--escala th {
            background: #fff;
            font-style: italic;
        }

        /* La cabecera de la tabla de ítems se repite en cada página. */
        .tabla--items {
            -fs-table-paginate: paginate;
        }

        .tabla--items th {
            padding: 4px;
            text-align: center;
            vertical-align: middle;
        }

        .tabla__item {
            width: 56%;
        }

        .tabla__nivel {
            width: 5%;
        }

        .tabla__observacion {
            width: 24%;
        }

        .tabla__enunciado {
            white-space: pre-wrap;
        }

        .tabla__casilla {
            height: 40px;
        }

        /* Matriz de puntajes: dos dimensiones por fila. */
        .puntajes {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
            table-layout: fixed;
        }

        .puntajes__celda {
            width: 50%;
            vertical-align: top;
            padding: 0;
        }

        .puntajes__celda--izquierda {
            padding-right: 6px;
        }

        .puntajes__celda--derecha {
            padding-left: 6px;
        }

        .puntajes__fila {
            page-break-inside: avoid;
        }

        .tabla--puntajes thead th,
        .tabla--puntajes tbody th {
            text-transform: uppercase;
        }
    </style>
</head>
<body>
<!-- Encabezado institucional común a todas las hojas. -->
<img th:fragment="encabezado" class="hoja__encabezado" th:src="${encabezado}"
     alt="Gobierno Regional de Cusco · Gerencia Regional de Educación Cusco · Dirección de Gestión Pedagógica" />
</body>
</html>
